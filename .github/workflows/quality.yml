name: Quality
on:
  pull_request:
  push:
    branches: [main, feature/fase-1-fundacao-mobile, fix/expo-sdk-58-ios]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:api
      - run: npm run check:routes
      - run: npm run check:secrets
      - run: npm run check:dependencies -w @omini/mobile
      - run: npm run doctor -w @omini/mobile
      - run: npm run prisma:validate -w @omini/api
        env:
          DATABASE_URL: "sqlserver://127.0.0.1:1433;database=omini;user=PLACEHOLDER;password={PLACEHOLDER};encrypt=true;trustServerCertificate=true"
      - run: npm run export:android -w @omini/mobile -- --max-workers 2
      - run: npm run export:ios -w @omini/mobile -- --max-workers 2
